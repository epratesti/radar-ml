name: Restore Simple
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore bot.py
        run: |
          git show 689afe7:bot.py > bot.py
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add bot.py
          git commit -m "restore bot.py from 689afe7 (pre-PLACEHOLDER)" || true
          git push origin HEAD:main

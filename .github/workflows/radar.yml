name: Radar ML

on:
  schedule:
    # 2x por hora (UTC) → ~:10 e :40 SP — GitHub schedule é irregular
    - cron: "10 * * * *"
    - cron: "40 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar radar
        run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_AFFILIATE_ID: "71970283"
          POSTS_POR_GRUPO: "4"
          MAX_POSTS: "16"

      - name: Salvar dados atualizados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/trends.json state/posted.json || true
          if git diff --cached --quiet; then
            echo "Nenhuma mudança para commit"
            exit 0
          fi
          git commit -m "Atualiza tendências $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push falhou (tentativa $i), tentando de novo..."
            sleep 3
          done

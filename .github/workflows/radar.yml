name: Radar Shopee

on:
  schedule:
    # Horário de Brasília: 08h, 10h, 12h, 14h, 16h, 18h, 20h e 22h (cron é em UTC, -3h)
    - cron: "7 11,13,15,17,19,21,23,1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Teste: mostra os posts no log, sem enviar nem salvar nada"
        type: boolean
        default: false

permissions:
  contents: write

# Evita duas execuções ao mesmo tempo (postagem duplicada / conflito no posted.json)
concurrency:
  group: radar-shopee
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERTA_CHAT_ID: ${{ secrets.ALERTA_CHAT_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          MAX_POSTS: ${{ vars.MAX_POSTS || '2' }}
          SHOPEE_MIN_VENDAS: ${{ vars.SHOPEE_MIN_VENDAS || '20' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python bot.py

      - name: Salvar estado e site
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add state/posted.json docs/trends.json
          if git diff --cached --quiet; then
            echo "Sem mudanças para salvar"
            exit 0
          fi
          git commit -m "chore: atualiza estado e trends"
          git pull --rebase origin main
          git push
